<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ONYX ONE - Executive Sovereign Operating System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #050505;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .portal-link {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            text-decoration: none;
        }
        .landing-image {
            max-width: 100%;
            max-height: 100vh;
            object-fit: contain;
            cursor: pointer;
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.2);
            transition: transform 0.3s ease;
        }
        .landing-image:hover {
            transform: scale(1.01);
        }
    </style>
</head>
<body>

    <a href="app.html" class="portal-link">
        <img src="7653.png" alt="Onyx One Sovereign Intelligence" class="landing-image">
    </a>

</body>
</html>
