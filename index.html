<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ONYX ONE // Sovereign Intelligence Portal</title>
    <style>
        body {
            margin: 0;
            background-color: #050505;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            transition: opacity 1s ease;
        }
        body.dissolve { opacity: 0; }
        .portal-link { width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; text-decoration: none; }
        img { max-width: 100%; max-height: 100vh; object-fit: contain; cursor: pointer; }
    </style>
</head>
<body>
    <a href="app.html" class="portal-link" onclick="fade(event)">
        <img src="7653.png" alt="Onyx One Logo">
    </a>
    <script>
        function fade(e) {
            e.preventDefault();
            document.body.classList.add('dissolve');
            setTimeout(() => { window.location.href = 'app.html'; }, 1000);
        }
    </script>
</body>
</html>
