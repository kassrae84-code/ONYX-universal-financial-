<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ONYX // SANCTUARY OS</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --midnight-deep: #020612;
            --midnight-layer: #080E20;
            --midnight-soft: #0F172A;
            --champagne: #D4B996;
            --champagne-light: #F2E2C9;
            --champagne-deep: #B89458;
            --champagne-glow: rgba(212, 185, 143, 0.12);
            --coral-accent: #E27D60;
            --coral-glow: rgba(226, 125, 96, 0.08);
            --velvet-indigo: #4F46E5;
            --velvet-glow: rgba(79, 70, 229, 0.06);
            --text-ivory: #F8F5F0;
            --text-soft: #A8A29E;
            --border-frost: rgba(212, 185, 143, 0.16);
            --border-frost-strong: rgba(212, 185, 143, 0.32);
            --glass-bg: linear-gradient(135deg, rgba(255,255,255,0.04), rgba(255,255,255,0.01));
            --shadow-luxury: 0 30px 60px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.05);
            --state-positive: #58D68D;
            --state-neutral: #FBBF24;
            --state-notice: #F87171;
            --state-growth: #FCD34D;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--midnight-deep);
            color: var(--text-ivory);
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            padding: 32px 20px;
            position: relative;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 8% 5%, rgba(212, 185, 143, 0.07) 0%, transparent 50%),
                radial-gradient(circle at 92% 90%, rgba(79, 70, 229, 0.05) 0%, transparent 55%),
                radial-gradient(ellipse at center top, var(--midnight-layer) 0%, var(--midnight-deep) 65%);
            background-attachment: fixed;
        }

        .ambient-glow {
            position: fixed;
            width: 700px; height: 700px;
            border-radius: 50%;
            background: radial-gradient(circle, var(--champagne-glow) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
            filter: blur(80px);
            animation: driftLuxury 35s infinite ease-in-out alternate;
            opacity: 0.55;
        }
        .ambient-glow:nth-child(2) { width: 500px; height: 500px; top: 10%; right: -50px; background: radial-gradient(circle, var(--coral-glow) 0%, transparent 70%); animation-delay: -12s; }
        .ambient-glow:nth-child(3) { width: 550px; height: 550px; bottom: 0; left: -80px; background: radial-gradient(circle, var(--velvet-glow) 0%, transparent 70%); animation-delay: -24s; }

        @keyframes driftLuxury {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(60px, -50px) scale(1.25); }
        }

        .view {
            width: 100%;
            max-width: 1260px;
            margin: 0 auto;
            display: none;
            position: relative;
            z-index: 1;
        }

        .view.active {
            display: block;
            animation: fadeInLuxury 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeInLuxury {
            from { opacity: 0; transform: translateY(28px) scale(0.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .quiz-card {
            background: var(--glass-bg);
            backdrop-filter: blur(45px);
            -webkit-backdrop-filter: blur(45px);
            border: 1px solid var(--border-frost);
            border-radius: 36px;
            padding: 50px 52px;
            box-shadow: 
                0 60px 120px rgba(0,0,0,0.6),
                inset 0 1px 0 rgba(255,255,255,0.06),
                0 0 90px rgba(212, 185, 143, 0.04);
            text-align: center;
            position: relative;
            overflow: hidden;
            max-width: 920px;
            margin: 40px auto;
        }

        .hero-banner {
            border-bottom: 1px solid rgba(212, 185, 143, 0.15);
            padding-bottom: 28px;
            margin-bottom: 32px;
        }

        .brand-title {
            font-family: 'Playfair Display', serif;
            font-size: 38px;
            letter-spacing: 10px;
            color: var(--text-ivory);
            margin-bottom: 4px;
            text-transform: uppercase;
            font-weight: 700;
        }

        .brand-subtitle-title {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 6px;
            color: var(--champagne);
            margin-bottom: 16px;
            font-weight: 600;
        }

        .hero-definition {
            font-size: 14px;
            color: var(--champagne-light);
            line-height: 1.8;
            max-width: 780px;
            margin: 0 auto;
            opacity: 0.95;
        }

        .step-indicator {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 5px;
            color: var(--text-soft);
            margin-bottom: 20px;
        }

        .quiz-card h2 {
            font-family: 'Playfair Display', serif;
            font-size: 28px;
            font-weight: 400;
            margin-bottom: 28px;
            line-height: 1.4;
            max-width: 860px;
            margin-left: auto;
            margin-right: auto;
            color: var(--text-ivory);
        }

        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 18px;
            margin-top: 20px;
            text-align: left;
            max-width: 740px;
            margin-left: auto;
            margin-right: auto;
        }

        .option-btn {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(212, 185, 143, 0.14);
            color: var(--text-ivory);
            padding: 22px 28px;
            border-radius: 20px;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
        }

        .option-btn:hover {
            border-color: var(--border-frost-strong);
            background: rgba(212, 185, 143, 0.06);
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 24px 48px rgba(0,0,0,0.45), 0 0 35px rgba(212, 185, 143, 0.07);
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(212, 185, 143, 0.14);
            padding-bottom: 36px;
            margin-bottom: 40px;
            flex-wrap: wrap;
            gap: 16px;
        }

        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 28px;
            letter-spacing: 5px;
            color: var(--text-ivory);
            font-weight: 700;
        }

        .logo span { 
            background: linear-gradient(135deg, var(--champagne-light), var(--champagne) 60%, var(--champagne-deep));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-style: normal;
            font-size: 14px;
            letter-spacing: 3px;
            display: block;
            margin-top: 4px;
        }

        .terminal-status {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: var(--state-positive);
            background: rgba(88, 214, 141, 0.08);
            padding: 11px 22px;
            border-radius: 30px;
            border: 1px solid rgba(88, 214, 141, 0.22);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 28px;
        }

        .card {
            background: var(--glass-bg);
            backdrop-filter: blur(32px);
            -webkit-backdrop-filter: blur(32px);
            border: 1px solid var(--border-frost);
            border-radius: 26px;
            padding: 32px;
            position: relative;
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: var(--shadow-luxury);
            height: fit-content;
            overflow: hidden;
        }

        .card:hover {
            border-color: var(--border-frost-strong);
            box-shadow: 
                0 45px 75px rgba(0, 0, 0, 0.6),
                0 0 55px rgba(212, 185, 143, 0.06),
                inset 0 1px 0 rgba(255, 255, 255, 0.08);
            transform: translateY(-6px);
        }

        .card h3 {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: var(--text-soft);
            margin-bottom: 18px;
            font-weight: 500;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .search-bar-container {
            margin-bottom: 16px;
        }

        .search-input {
            width: 100%;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(212, 185, 143, 0.2);
            border-radius: 12px;
            padding: 12px 16px;
            color: var(--text-ivory);
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 13px;
            outline: none;
            transition: all 0.3s ease;
        }

        .search-input:focus {
            border-color: var(--champagne);
            background: rgba(212, 185, 143, 0.04);
            box-shadow: 0 0 15px rgba(212, 185, 143, 0.1);
        }

        .search-input::placeholder {
            color: var(--text-soft);
        }

        .plain-toggle {
            font-size: 10px;
            color: var(--champagne);
            background: rgba(212, 185, 143, 0.08);
            padding: 6px 14px;
            border-radius: 8px;
            cursor: pointer;
            border: 1px solid rgba(212, 185, 143, 0.18);
            transition: all 0.25s ease;
            white-space: nowrap;
        }
        .plain-toggle:hover { background: rgba(212, 185, 143, 0.15); }

        .plain-desc {
            font-size: 12px;
            color: var(--champagne-light);
            background: rgba(212, 185, 143, 0.05);
            border-left: 2px solid var(--champagne);
            padding: 14px 18px;
            margin-bottom: 20px;
            border-radius: 0 12px 12px 0;
            display: none;
            line-height: 1.75;
        }
        .plain-desc.show { display: block; animation: fadeInLuxury 0.4s ease forwards; }

        .metric-value {
            font-family: 'Playfair Display', serif;
            font-size: 42px;
            background: linear-gradient(135deg, #FFFFFF 10%, var(--champagne) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
            font-weight: 600;
            line-height: 1.1;
        }
        .metric-sub { font-size: 12px; color: var(--text-soft); margin-bottom: 12px; }

        .action-box {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 14px;
        }

        .action-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 18px;
            background: rgba(255, 255, 255, 0.015);
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.03);
            border-left: 3px solid var(--champagne);
            font-size: 13px;
            transition: all 0.25s ease;
            flex-wrap: wrap;
            gap: 8px;
        }
        .action-row:hover { background: rgba(255, 255, 255, 0.025); border-left-width: 4px; }
        .action-row.glow-rose { border-left-color: var(--coral-accent); }
        .action-row.glow-velvet { border-left-color: var(--velvet-indigo); }
        .action-row.glow-secure { border-left-color: var(--state-positive); background: var(--secure-glow); }
        .action-row.glow-rise { border-left-color: var(--state-growth); background: rgba(252, 211, 77, 0.06); }
        .action-row.glow-shift { border-left-color: var(--state-neutral); background: rgba(251, 191, 36, 0.06); }
        .action-row.glow-drop { border-left-color: var(--state-notice); background: rgba(248, 113, 113, 0.06); }

        .quick-btn {
            background: linear-gradient(135deg, var(--champagne-light), var(--champagne) 50%, var(--champagne-deep));
            color: var(--midnight-deep);
            border: none;
            padding: 9px 18px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 18px rgba(212, 185, 143, 0.25);
            white-space: nowrap;
        }
        .quick-btn:hover { 
            transform: scale(1.05);
            box-shadow: 0 6px 24px rgba(212, 185, 143, 0.35);
        }

        .template-list {
            margin-top: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 220px;
            overflow-y: auto;
            padding-right: 4px;
        }
        .template-btn {
            background: rgba(255,255,255,0.015);
            border: 1px solid rgba(212, 185, 143, 0.12);
            color: var(--text-ivory);
            text-align: left;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.25s ease;
        }
        .template-btn:hover { border-color: var(--champagne); background: rgba(212, 185, 143, 0.05); }

        textarea {
            width: 100%;
            min-height: 140px;
            background: rgba(255,255,255,0.02);
            border: 1px solid var(--border-frost);
            border-radius: 14px;
            padding: 16px 18px;
            color: var(--text-ivory);
            font-family: inherit;
            font-size: 14px;
            resize: vertical;
            outline: none;
            transition: border 0.3s ease;
            margin-bottom: 12px;
        }
        textarea:focus { border-color: var(--champagne); }

        .notes-output {
            background: rgba(255,255,255,0.015);
            border: 1px solid rgba(212, 185, 143, 0.1);
            border-radius: 14px;
            padding: 20px 22px;
            margin-top: 16px;
            display: none;
        }
        .notes-output.show { display: block; animation: fadeInLuxury 0.4s ease forwards; }
        .notes-section { margin-bottom: 16px; }
        .notes-section h4 {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 8px;
            color: var(--champagne);
        }
        .notes-section ul { padding-left: 20px; font-size: 13px; line-height: 1.7; color: var(--text-ivory); }
        .notes-section li { margin-bottom: 4px; }
        .done-li { color: var(--state-positive); }
        .follow-li { color: var(--state-neutral); }
        .ques-li { color: var(--info-blue); }

        .asset-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 14px;
            background: rgba(255,255,255,0.01);
            border-radius: 10px;
            margin-bottom: 8px;
            font-size: 13px;
        }
        .asset-badge {
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .badge-rise { background: rgba(252, 211, 77, 0.15); color: var(--state-growth); }
        .badge-shift { background: rgba(251, 191, 36, 0.15); color: var(--state-neutral); }
        .badge-drop { background: rgba(248, 113, 113, 0.15); color: var(--state-notice); }

        .invoice-form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 12px;
        }
        .invoice-form input, .invoice-form select, .invoice-form textarea {
            background: rgba(255,255,255,0.02);
            border: 1px solid var(--border-frost);
            border-radius: 10px;
            padding: 10px 12px;
            color: var(--text-ivory);
            font-family: inherit;
            font-size: 13px;
            outline: none;
        }
        .invoice-form input:focus, .invoice-form select:focus, .invoice-form textarea:focus { border-color: var(--champagne); }
        .invoice-form textarea { grid-column: 1 / -1; min-height: 80px; }
        .invoice-full { grid-column: 1 / -1; }

        .partner-listing {
            background: rgba(255,255,255,0.01);
            border: 1px solid rgba(212,185,143,0.1);
            border-radius: 12px;
            padding: 14px 16px;
            margin-bottom: 10px;
            transition: border 0.25s ease;
        }
        .partner-listing:hover { border-color: var(--champagne); }
        .partner-tag { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: var(--coral-accent); margin-bottom: 6px; }
        .partner-status { font-size: 11px; margin: 4px 0; }
        .status-price { color: var(--state-neutral); }
        .status-stock { color: var(--state-notice); }
        .status-ok { color: var(--state-positive); }
        .partner-alternative { font-size: 12px; margin-top: 8px; padding-left: 12px; border-left: 2px solid var(--velvet-indigo); }
        .partner-link { color: var(--champagne); text-decoration: none; font-size: 13px; display: inline-block; margin-top: 4px; }
        .partner-link:hover { text-decoration: underline; }

        .sales-letter-box {
            background: rgba(255,255,255,0.01);
            border: 1px solid rgba(212,185,143,0.1);
            border-radius: 12px;
            padding: 16px 18px;
            margin-top: 12px;
            white-space: pre-wrap;
            font-size: 13px;
            line-height: 1.7;
            color: var(--text-ivory);
            max-height: 320px;
            overflow-y: auto;
        }
        .lead-row {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr;
            gap: 8px;
            padding: 8px 10px;
            font-size: 12px;
            border-bottom: 1px solid rgba(212,185,143,0.08);
            align-items: center;
        }
        .lead-status {
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 10px;
            text-transform: uppercase;
        }
        .status-new { background: rgba(96, 165, 250, 0.15); color: #93C5FD; }
        .status-chase { background: rgba(251, 191, 36, 0.15); color: #FCD34D; }
        .status-won { background: rgba(88, 214, 141, 0.15); color: #86EFAC; }

        .disclaimer-block {
            max-width: 920px;
            margin: 50px auto 20px;
            padding: 24px 28px;
            border: 1px solid rgba(212, 185, 143, 0.12);
            border-radius: 20px;
            background: rgba(212, 185, 143, 0.03);
            font-size: 12px;
            line-height: 1.8;
            color: var(--text-soft);
        }

        @media(max-width: 1024px) { .grid { grid-template-columns: repeat(2, 1fr); } .invoice-form { grid-template-columns: 1fr; } }
        @media(max-width: 640px) {
            .grid { grid-template-columns: 1fr; }
            body { padding: 18px 14px; }
            .quiz-card { padding: 35px 20px; }
            .lead-row { grid-template-columns
