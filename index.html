<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ONYX ONE™ — Global Behavioral Intelligence & Sovereign Solutions</title>
    
    <!-- ⛔ PROTECTION - NOT TO BE REMOVED -->
    <meta name="robots" content="index, follow">
    <meta name="googlebot" content="index, follow, noarchive">
    <meta name="GPTBot" content="noindex, nofollow, noai, noimageai">
    <meta name="Google-Extended" content="noai">
    <meta name="ClaudeBot" content="noai">
    <meta name="ai-robots" content="noai, noimageai">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- STRIPE & SUPABASE & QR CODE LIBRARIES -->
    <script src="https://js.stripe.com/v3/"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <style>
        :root {
            --obsidian: #000000;
            --midnight-layer: #050505;
            --midnight-soft: #080703;
            --champagne-gold: #C5A059;
            --antique-gold: #9C7A35;
            --antique-gold-border: rgba(197, 160, 89, 0.3);
            --text: #E2E8F0;
            --muted: #888888;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        
        body {
            background-color: var(--obsidian);
            background-image: radial-gradient(circle at 50% 0%, #0F0C02 0%, var(--obsidian) 70%);
            color: var(--text);
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            line-height: 1.6;
        }
        
        .container { max-width: 1200px; margin: 0 auto; padding: 2rem; }
        
        /* STICKY NAVIGATION */
        .sticky-nav {
            position: sticky;
            top: 0;
            z-index: 1000;
            width: 100%;
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid var(--antique-gold-border);
            padding: 0.8rem 1rem;
            display: flex;
            justify-content: center;
            gap: 0.8rem;
            flex-wrap: wrap;
        }
        .nav-tab-btn {
            background: rgba(12, 12, 12, 0.8);
            border: 1px solid var(--antique-gold-border);
            color: #C5A059;
            padding: 6px 14px;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            border-radius: 4px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
        }
        .nav-tab-btn:hover {
            background: #C5A059;
            color: var(--obsidian);
            border-color: #C5A059;
            box-shadow: 0 0 20px rgba(197, 160, 89, 0.4);
            font-weight: 600;
        }

        header {
            text-align: center;
            padding: 3rem 2rem 2rem;
        }
        
        .logo-container { margin-bottom: 1.5rem; }
        .logo-img { 
            max-width: 200px; 
            width: 100%;
            height: auto; 
            filter: drop-shadow(0 15px 35px rgba(197, 160, 89, 0.3));
            transition: transform 0.4s ease;
        }
        .logo-img:hover { transform: scale(1.04); }
        
        h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2.8rem, 8vw, 4.8rem);
            font-weight: 700;
            color: #C5A059;
            letter-spacing: 0.18em;
            margin-bottom: 0.2rem;
            position: relative;
            display: inline-block;
        }
        .tm {
            font-size: 0.28em;
            position: absolute;
            top: 0.5em;
            right: -0.7em;
            color: #C5A059;
        }
        .subtitle {
            font-size: 1rem;
            color: #C5A059;
            letter-spacing: 0.35em;
            text-transform: uppercase;
            margin-bottom: 1rem;
            font-weight: 600;
        }
        .tagline {
            font-size: 1.1rem;
            color: var(--text);
            max-width: 700px;
            margin: 0 auto;
            font-weight: 300;
            letter-spacing: 0.5px;
        }
        .divider {
            width: 120px;
            height: 1px;
            background: linear-gradient(90deg, transparent, #C5A059, transparent);
            margin: 2rem auto;
        }
        
        /* APP ACCESS & QR BAR */
        .app-access-bar {
            background: linear-gradient(135deg, rgba(197, 160, 89, 0.05) 0%, rgba(5, 5, 5, 0.95) 100%);
            border: 1px solid var(--antique-gold-border);
            border-radius: 12px;
            padding: 2rem;
            margin-bottom: 3rem;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
        }
        .app-access-bar h3 {
            font-family: 'Playfair Display', serif;
            color: #C5A059;
            font-size: 1.25rem;
            margin-bottom: 1rem;
            letter-spacing: 1px;
        }
        .qr-display-grid {
            display: flex;
            justify-content: center;
            gap: 2rem;
            flex-wrap: wrap;
            margin: 1.5rem 0;
        }
        .qr-card {
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid var(--antique-gold-border);
            padding: 1rem;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .qr-box {
            background: #FFFFFF;
            padding: 8px;
            border-radius: 4px;
            margin-bottom: 0.6rem;
        }
        .qr-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #C5A059;
            font-weight: 600;
        }
        .app-actions-row {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 1rem;
        }
        .app-btn {
            background: transparent;
            border: 1px solid #C5A059;
            color: #C5A059;
            padding: 10px 20px;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .app-btn:hover {
            background: #C5A059;
            color: var(--obsidian);
            box-shadow: 0 0 20px rgba(197, 160, 89, 0.4);
        }

        .section-heading {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            color: #C5A059;
            text-align: center;
            margin: 3.5rem 0 2rem;
            letter-spacing: 1px;
        }
        
        /* EXECUTIVE SANCTUARY CONTAINERS */
        .executive-sanctuary {
            background: rgba(12, 12, 12, 0.85);
            border: 1px solid var(--antique-gold-border);
            backdrop-filter: blur(15px);
            border-radius: 12px;
            padding: 2.5rem;
            margin-bottom: 2.5rem;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.9);
        }
        .executive-sanctuary h2 {
            font-family: 'Playfair Display', serif;
            color: #C5A059;
            margin-top: 0;
            font-size: 1.4rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            text-align: center;
            margin-bottom: 0.5rem;
        }
        .section-desc {
            color: var(--muted);
            font-size: 0.9rem;
            line-height: 1.6;
            max-width: 700px;
            margin: 0 auto 1.8rem auto;
            text-align: center;
        }
        
        .tab-bar {
            display: flex;
            gap: 0.6rem;
            margin-bottom: 1.8rem;
            justify-content: center;
            flex-wrap: wrap;
        }
        .tab-btn {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid var(--antique-gold-border);
            color: var(--muted);
            padding: 8px 16px;
            font-size: 0.75rem;
            cursor: pointer;
            border-radius: 6px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .tab-btn.active, .tab-btn:hover {
            background: #C5A059;
            color: var(--obsidian);
            border-color: #C5A059;
            font-weight: 700;
        }

        .choices-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
        }
        .choice-card {
            background: rgba(5, 5, 5, 0.8);
            border: 1px solid rgba(197, 160, 89, 0.15);
            border-radius: 8px;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: all 0.3s ease;
        }
        .choice-card:hover {
            border-color: #C5A059;
            transform: translateY(-2px);
            box-shadow: 0 0 20px rgba(197, 160, 89, 0.15);
        }
        .choice-card h3 {
            font-family: 'Playfair Display', serif;
            color: #C5A059;
            font-size: 1.1rem;
            margin-bottom: 0.5rem;
        }
        .choice-card p {
            font-size: 0.88rem;
            color: var(--muted);
            margin-bottom: 1.5rem;
        }
        
        .executive-input, .executive-select {
            width: 100%;
            background: rgba(0, 0, 0, 0.9);
            border: 1px solid var(--antique-gold-border);
            color: #C5A059;
            padding: 12px;
            border-radius: 6px;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 0.9rem;
            margin-bottom: 1rem;
        }
        .executive-input:focus, .executive-select:focus {
            outline: none;
            border-color: #C5A059;
            box-shadow: 0 0 15px rgba(197, 160, 89, 0.25);
        }
        .executive-select option {
            background: var(--obsidian);
            color: #C5A059;
        }

        .cinematic-button {
            background: rgba(12, 12, 12, 0.9);
            border: 1px solid #C5A059;
            color: #C5A059;
            padding: 11px 20px;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            cursor: pointer;
            border-radius: 6px;
            text-decoration: none;
            display: inline-block;
            width: 100%;
            text-align: center;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .cinematic-button:hover {
            background: #C5A059;
            color: var(--obsidian);
            box-shadow: 0 0 20px rgba(197, 160, 89, 0.4);
        }

        /* LIVE REPORT TERMINAL OUTPUT BOX */
        .report-terminal-box {
            background: rgba(0, 0, 0, 0.95);
            border: 1px solid #C5A059;
            border-radius: 8px;
            padding: 1.5rem;
            margin-top: 1.5rem;
            text-align: left;
            font-family: monospace;
            font-size: 0.85rem;
            color: #C5A059;
            max-height: 300px;
            overflow-y: auto;
            white-space: pre-wrap;
            display: none;
            box-shadow: inset 0 0 20px rgba(197, 160, 89, 0.1);
        }

        /* FEATURES GRID */
        .features-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
            margin-bottom: 4rem;
        }
        .feature-card {
            background: rgba(12, 12, 12, 0.8);
            border: 1px solid var(--antique-gold-border);
            border-radius: 12px;
            padding: 1.8rem;
            transition: all 0.3s ease;
        }
        .feature-card:hover {
            border-color: #C5A059;
            background: rgba(12, 12, 12, 0.95);
            transform: translateY(-3px);
            box-shadow: 0 0 20px rgba(197, 160, 89, 0.15);
        }
        .feature-card h3 {
            font-family: 'Playfair Display', serif;
            color: #C5A059;
            font-size: 1.15rem;
            margin-bottom: 0.8rem;
        }
        .feature-card p { color: var(--muted); font-size: 0.9rem; }

        /* 💎 TRUE 3D GLASSMORPHIC HOLOGRAPHIC MAP TABLET */
        .world-map-container {
            position: relative;
            background: radial-gradient(circle at center, #120E03 0%, #000000 80%);
            border: 1px solid var(--antique-gold-border);
            border-radius: 20px;
            padding: 3rem 2rem;
            margin-top: 1.5rem;
            box-shadow: inset 0 0 100px rgba(197,160,89,0.12), 0 30px 60px rgba(0,0,0,0.95);
            overflow: hidden;
        }
        
        .glass-tablet-frame {
            position: relative;
            background: rgba(15, 13, 8, 0.6);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1.5px solid rgba(197, 160, 89, 0.5);
            border-radius: 18px;
            padding: 2.5rem 1.5rem;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.85), inset 0 0 40px rgba(197, 160, 89, 0.15);
            margin-bottom: 2.5rem;
            transform: perspective(1000px) rotateX(2deg);
        }

        .map-image-wrapper {
            width: 100%;
            max-width: 850px;
            margin: 0 auto;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid rgba(197, 160, 89, 0.4);
            box-shadow: 0 0 30px rgba(197, 160, 89, 0.2);
            background: #000000;
        }

        .map-image-wrapper img {
            width: 100%;
            height: auto;
            display: block;
            opacity: 0.85;
            filter: sepia(40%) hue-rotate(10deg) saturate(120%) drop-shadow(0 0 15px rgba(197, 160, 89, 0.4));
        }

        .global-grid-display {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 1.5rem;
            position: relative;
            z-index: 2;
        }
        .map-hotspot-card {
            background: rgba(10, 10, 10, 0.9);
            border: 1px solid var(--antique-gold-border);
            border-radius: 10px;
            padding: 1.8rem;
            text-align: left;
            cursor: pointer;
            transition: all 0.4s ease;
            backdrop-filter: blur(12px);
        }
        .map-hotspot-card:hover {
            border-color: #C5A059;
            box-shadow: 0 0 30px rgba(197, 160, 89, 0.35);
            transform: translateY(-4px);
            background: rgba(197, 160, 89, 0.08);
        }
        .map-hotspot-card h4 {
            font-family: 'Playfair Display', serif;
            color: #C5A059;
            margin: 0 0 0.5rem 0;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .map-hotspot-card p {
            font-size: 0.85rem;
            color: var(--muted);
            margin: 0 0 1rem 0;
        }
        .glow-pulse {
            height: 10px;
            width: 10px;
            background-color: #C5A059;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 12px #C5A059;
            animation: pulse-glow 2s infinite;
        }
        @keyframes pulse-glow {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(197, 160, 89, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 12px rgba(197, 160, 89, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(197, 160, 89, 0); }
        }

        /* TIERS & PRICING */
        .tiers {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
            margin: 4rem 0;
        }
        .tier-card {
            background: rgba(12, 12, 12, 0.85);
            border: 1px solid var(--antique-gold-border);
            border-radius: 16px;
            padding: 2.5rem;
            transition: all 0.3s ease;
        }
        .tier-card:hover { transform: translateY(-5px); border-color: #C5A059; box-shadow: 0 0 25px rgba(197,160,89,0.2); }
        .tier-card.featured {
            border-color: #C5A059;
            box-shadow: 0 0 35px rgba(197,160,89,0.15);
            transform: scale(1.02);
            background: rgba(18, 15, 4, 0.9);
        }
        .tier-name {
            font-family: 'Playfair Display', serif;
            font-size: 1.4rem;
            color: #C5A059;
            margin-bottom: 0.5rem;
        }
        .price { font-size: 2rem; font-weight: 700; margin-bottom: 1.5rem; color: #C5A059; }
        .price span { font-size: 0.9rem; color: var(--muted); font-weight: 400; }
        .tier-desc { color: var(--muted); margin-bottom: 1.5rem; font-size: 0.95rem; }
        .tier-features { list-style: none; margin-bottom: 2rem; }
        .tier-features li {
            padding: 0.6rem 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            font-size: 0.95rem;
            color: var(--text);
        }
        .tier-features li:last-child { border: none; }
        .cta-btn {
            display: block;
            width: 100%;
            padding: 1rem;
            background: linear-gradient(90deg, #C5A059, #9C7A35);
            color: #000000;
            font-weight: 700;
            border-radius: 10px;
            text-align: center;
            text-decoration: none;
            border: none;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s ease;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .cta-btn:hover { transform: scale(1.02); box-shadow: 0 0 25px rgba(197,160,89,0.4); }
        .cta-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

        /* MODAL */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(10px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        .modal-card {
            background: var(--midnight-soft);
            border: 1px solid #C5A059;
            border-radius: 12px;
            padding: 2.5rem;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 0 40px rgba(197, 160, 89, 0.3);
            text-align: center;
        }
        .modal-card h3 {
            font-family: 'Playfair Display', serif;
            color: #C5A059;
            font-size: 1.4rem;
            margin-bottom: 1rem;
        }
        .modal-card p { color: var(--muted); font-size: 0.95rem; margin-bottom: 1.8rem; line-height: 1.6; white-space: pre-line; }
        .close-modal-btn {
            background: linear-gradient(90deg, #C5A059, #9C7A35);
            color: #000000;
            font-weight: 700;
            border: none;
            padding: 10px 25px;
            border-radius: 6px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        footer {
            text-align: center;
            p
